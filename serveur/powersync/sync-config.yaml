# Ce que chaque appareil reçoit du serveur.
# Règle : uniquement les données des organisations auxquelles la personne
# connectée est rattachée (auth.user_id() = son identifiant de compte).

config:
  edition: 3

streams:
  # L'espace de la personne : ses organisations, leurs sites, ses rattachements
  # et son profil. Prioritaire : c'est ce que l'app affiche en premier.
  mon_espace:
    auto_subscribe: true
    priority: 1
    queries:
      - SELECT * FROM organisations WHERE id IN (SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true)
      - SELECT * FROM sites WHERE organisation_id IN (SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true)
      - SELECT * FROM rattachements WHERE user_id = auth.user_id()
      - SELECT * FROM personnes WHERE id = auth.user_id()

  # Configuration de l'établissement (étape 2) : année, niveaux, classes,
  # matières et frais des organisations de la personne.
  configuration:
    auto_subscribe: true
    priority: 2
    with:
      mes_orgs: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true
    queries:
      - SELECT * FROM annees_scolaires WHERE organisation_id IN mes_orgs
      - SELECT * FROM niveaux WHERE organisation_id IN mes_orgs
      - SELECT * FROM classes WHERE organisation_id IN mes_orgs
      - SELECT * FROM matieres WHERE organisation_id IN mes_orgs
      - SELECT * FROM frais WHERE organisation_id IN mes_orgs
      - SELECT * FROM echeances WHERE organisation_id IN mes_orgs

  # Sa propre fiche du personnel, ses fonctions et ses droits particuliers :
  # l'app en déduit ce que la personne peut faire.
  ma_fiche:
    auto_subscribe: true
    priority: 1
    with:
      mes_fiches: SELECT id FROM personnel WHERE user_id = auth.user_id()
    queries:
      - SELECT * FROM personnel WHERE user_id = auth.user_id()
      - SELECT * FROM affectations WHERE personnel_id IN mes_fiches
      - SELECT * FROM droits_personnel WHERE personnel_id IN mes_fiches

  # Gestion du personnel (étape 3). Le fondateur reçoit tout le personnel de son
  # groupe ; un directeur, celui de ses sites (y compris les personnes d'un autre
  # site qui y ont une fonction). Les autres ne reçoivent que leur fiche.
  personnel:
    auto_subscribe: true
    priority: 2
    with:
      orgs_fondees: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND role = 'fondateur'
      orgs_dirigees: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND role = 'directeur' AND site_id IS NULL
      sites_diriges: SELECT site_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND role = 'directeur'
    queries:
      - SELECT * FROM personnel WHERE organisation_id IN orgs_fondees
      - SELECT * FROM affectations WHERE organisation_id IN orgs_fondees
      - SELECT * FROM droits_personnel WHERE organisation_id IN orgs_fondees
      - SELECT * FROM personnel WHERE organisation_id IN orgs_dirigees AND site_id IS NOT NULL
      - SELECT * FROM affectations WHERE organisation_id IN orgs_dirigees AND site_id IS NOT NULL
      - SELECT * FROM personnel WHERE site_id IN sites_diriges
      - SELECT * FROM affectations WHERE site_id IN sites_diriges
      - SELECT * FROM personnel WHERE id IN (SELECT personnel_id FROM affectations WHERE site_id IN sites_diriges)
      - SELECT * FROM droits_personnel WHERE personnel_id IN (SELECT id FROM personnel WHERE site_id IN sites_diriges)

  # Postes de travail (étape 4). Chaque poste reçoit sa propre ligne (pour
  # savoir s'il est bloqué) ; le fondateur et les directeurs, ceux de leur périmètre.
  postes:
    auto_subscribe: true
    priority: 1
    with:
      orgs_fondees: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND role = 'fondateur'
      orgs_dirigees: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND role = 'directeur' AND site_id IS NULL
      sites_diriges: SELECT site_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND role = 'directeur'
    queries:
      - SELECT * FROM postes WHERE user_id = auth.user_id()
      - SELECT * FROM postes WHERE organisation_id IN orgs_fondees
      - SELECT * FROM postes WHERE organisation_id IN orgs_dirigees AND site_id IS NOT NULL
      - SELECT * FROM postes WHERE site_id IN sites_diriges

  # Élèves et inscriptions : tous les membres de l'école (listes de classe).
  eleves:
    auto_subscribe: true
    priority: 3
    with:
      mes_orgs: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true
    queries:
      - SELECT * FROM eleves WHERE organisation_id IN mes_orgs
      - SELECT * FROM inscriptions WHERE organisation_id IN mes_orgs
      - SELECT * FROM historique_eleves WHERE organisation_id IN mes_orgs
      - SELECT * FROM souscriptions WHERE organisation_id IN mes_orgs

  # Contacts des familles (téléphones) et caisse : seulement les fonctions qui
  # inscrivent, encaissent ou dirigent. Le serveur vérifie aussi les droits accordés un par un.
  familles:
    auto_subscribe: true
    priority: 3
    with:
      orgs_familles: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND (role = 'fondateur' OR role = 'directeur' OR role = 'secretaire' OR role = 'comptable' OR role = 'caissier')
    queries:
      - SELECT * FROM contacts WHERE organisation_id IN orgs_familles
      - SELECT * FROM eleves_contacts WHERE organisation_id IN orgs_familles
      - SELECT * FROM encaissements WHERE organisation_id IN orgs_familles
      - SELECT * FROM lignes_encaissement WHERE organisation_id IN orgs_familles

  # Table de test « Bonjour » (première version de l'app).
  hellos:
    auto_subscribe: true
    query: SELECT * FROM hellos
