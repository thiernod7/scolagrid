# Ce que chaque appareil reçoit du serveur.
# Règle : uniquement les données des organisations auxquelles la personne
# connectée est rattachée (auth.user_id() = son identifiant de compte).

config:
  edition: 3

streams:
  # L'espace de la personne : ses organisations, leurs sites, ses rattachements
  # et son profil. Prioritaire : c'est ce que l'app affiche en premier.
  mon_espace:
    auto_subscribe: true
    priority: 1
    queries:
      - SELECT * FROM organisations WHERE id IN (SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true)
      - SELECT * FROM sites WHERE organisation_id IN (SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true)
      - SELECT * FROM rattachements WHERE user_id = auth.user_id()
      - SELECT * FROM personnes WHERE id = auth.user_id()

  # Configuration de l'établissement (étape 2) : année, niveaux, classes,
  # matières et frais des organisations de la personne.
  configuration:
    auto_subscribe: true
    priority: 2
    with:
      mes_orgs: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true
      # Les classes : toutes, sauf pour qui est limité à des cycles (voir le flux « perimetre »).
      orgs_sans_limite: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND cycles IS NULL
    queries:
      - SELECT * FROM annees_scolaires WHERE organisation_id IN mes_orgs
      - SELECT * FROM niveaux WHERE organisation_id IN mes_orgs
      - SELECT * FROM classes WHERE organisation_id IN orgs_sans_limite
      - SELECT * FROM matieres WHERE organisation_id IN mes_orgs
      - SELECT * FROM frais WHERE organisation_id IN mes_orgs
      - SELECT * FROM echeances WHERE organisation_id IN mes_orgs
      - SELECT * FROM regles_reduction WHERE organisation_id IN mes_orgs
      - SELECT * FROM tranches_annee WHERE organisation_id IN mes_orgs
      - SELECT * FROM historique_frais WHERE organisation_id IN mes_orgs
      - SELECT * FROM pieces_dossier WHERE organisation_id IN mes_orgs
      - SELECT * FROM images_ecole WHERE organisation_id IN mes_orgs AND sorte = 'logo'
      # Qui enseigne quoi (pas de donnée personnelle : des identifiants et des dates).
      - SELECT * FROM enseignements WHERE organisation_id IN mes_orgs

  # Sa propre fiche du personnel, ses fonctions et ses droits particuliers :
  # l'app en déduit ce que la personne peut faire.
  ma_fiche:
    auto_subscribe: true
    priority: 1
    with:
      mes_fiches: SELECT id FROM personnel WHERE user_id = auth.user_id()
    queries:
      - SELECT * FROM personnel WHERE user_id = auth.user_id()
      - SELECT * FROM affectations WHERE personnel_id IN mes_fiches
      - SELECT * FROM droits_personnel WHERE personnel_id IN mes_fiches

  # Gestion du personnel (étape 3). Le fondateur reçoit tout le personnel de son
  # groupe ; un directeur, celui de ses sites (y compris les personnes d'un autre
  # site qui y ont une fonction). Les autres ne reçoivent que leur fiche.
  personnel:
    auto_subscribe: true
    priority: 2
    with:
      orgs_fondees: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND role = 'fondateur'
      orgs_dirigees: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND role = 'directeur' AND site_id IS NULL
      sites_diriges: SELECT site_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND role = 'directeur'
    queries:
      - SELECT * FROM personnel WHERE organisation_id IN orgs_fondees
      - SELECT * FROM affectations WHERE organisation_id IN orgs_fondees
      - SELECT * FROM droits_personnel WHERE organisation_id IN orgs_fondees
      - SELECT * FROM personnel WHERE organisation_id IN orgs_dirigees AND site_id IS NOT NULL
      - SELECT * FROM affectations WHERE organisation_id IN orgs_dirigees AND site_id IS NOT NULL
      - SELECT * FROM personnel WHERE site_id IN sites_diriges
      - SELECT * FROM affectations WHERE site_id IN sites_diriges
      - SELECT * FROM personnel WHERE id IN (SELECT personnel_id FROM affectations WHERE site_id IN sites_diriges)
      - SELECT * FROM droits_personnel WHERE personnel_id IN (SELECT id FROM personnel WHERE site_id IN sites_diriges)

  # Liste du personnel en lecture : qui a reçu « voir_personnel » (un lecteur, par exemple).
  personnel_lu:
    auto_subscribe: true
    priority: 3
    with:
      orgs_lit_personnel: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND lit_personnel = true
    queries:
      - SELECT * FROM personnel WHERE organisation_id IN orgs_lit_personnel
      - SELECT * FROM affectations WHERE organisation_id IN orgs_lit_personnel

  # Postes de travail (étape 4). Chaque poste reçoit sa propre ligne (pour
  # savoir s'il est bloqué), ainsi que qui travaille sur son site (poste partagé) ;
  # le fondateur et les directeurs, ceux de leur périmètre.
  postes:
    auto_subscribe: true
    priority: 1
    with:
      orgs_fondees: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND role = 'fondateur'
      orgs_dirigees: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND role = 'directeur' AND site_id IS NULL
      sites_diriges: SELECT site_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND role = 'directeur'
      # Poste partagé : qui travaille sur un site voit ses postes (bloqué ou non).
      mes_sites: SELECT site_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND site_id IS NOT NULL
      orgs_tous_sites: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND site_id IS NULL
    queries:
      - SELECT * FROM postes WHERE user_id = auth.user_id()
      - SELECT * FROM postes WHERE site_id IN mes_sites
      - SELECT * FROM postes WHERE organisation_id IN orgs_tous_sites AND site_id IS NOT NULL
      - SELECT * FROM postes WHERE organisation_id IN orgs_fondees
      - SELECT * FROM postes WHERE organisation_id IN orgs_dirigees AND site_id IS NOT NULL
      - SELECT * FROM postes WHERE site_id IN sites_diriges

  # Élèves et inscriptions : tous les membres de l'école (listes de classe).
  # Tous les élèves : pour qui a une fonction autre qu'« enseignant » dans l'école.
  eleves:
    auto_subscribe: true
    priority: 3
    with:
      mes_orgs: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND role != 'enseignant' AND cycles IS NULL
    queries:
      - SELECT * FROM eleves WHERE organisation_id IN mes_orgs
      - SELECT * FROM inscriptions WHERE organisation_id IN mes_orgs
      - SELECT * FROM historique_eleves WHERE organisation_id IN mes_orgs
      - SELECT * FROM souscriptions WHERE organisation_id IN mes_orgs
      - SELECT * FROM reductions_eleves WHERE organisation_id IN mes_orgs
      - SELECT * FROM impressions_documents WHERE organisation_id IN mes_orgs
      - SELECT * FROM photos_eleves WHERE organisation_id IN mes_orgs

  # L'enseignant : les élèves de ses classes (où il enseigne, ou dont il est
  # professeur principal), ses épreuves et ses notes ; le professeur principal
  # reçoit aussi les notes de toute sa classe. Ni familles, ni santé, ni paiements
  # (la fiche élève est la même table ; l'app n'en montre que l'identité).
  enseignant:
    auto_subscribe: true
    priority: 3
    with:
      mes_services: SELECT service FROM enseignements WHERE personnel_id IN (SELECT id FROM personnel WHERE user_id = auth.user_id() AND statut = 'actif')
      mes_classes: SELECT classe_id FROM enseignements WHERE personnel_id IN (SELECT id FROM personnel WHERE user_id = auth.user_id() AND statut = 'actif')
      mes_classes_pp: SELECT id FROM classes WHERE professeur_principal_id IN (SELECT id FROM personnel WHERE user_id = auth.user_id() AND statut = 'actif')
      mes_orgs_ens: SELECT organisation_id FROM enseignements WHERE personnel_id IN (SELECT id FROM personnel WHERE user_id = auth.user_id() AND statut = 'actif')
    queries:
      - SELECT * FROM inscriptions WHERE classe_id IN mes_classes
      - SELECT * FROM inscriptions WHERE classe_id IN mes_classes_pp
      - SELECT * FROM eleves WHERE id IN (SELECT eleve_id FROM inscriptions WHERE classe_id IN mes_classes)
      - SELECT * FROM eleves WHERE id IN (SELECT eleve_id FROM inscriptions WHERE classe_id IN mes_classes_pp)
      - SELECT * FROM photos_eleves WHERE eleve_id IN (SELECT eleve_id FROM inscriptions WHERE classe_id IN mes_classes)
      - SELECT * FROM photos_eleves WHERE eleve_id IN (SELECT eleve_id FROM inscriptions WHERE classe_id IN mes_classes_pp)
      - SELECT * FROM periodes_evaluation WHERE organisation_id IN mes_orgs_ens
      - SELECT * FROM types_evaluation WHERE organisation_id IN mes_orgs_ens
      - SELECT * FROM sessions_evaluation WHERE organisation_id IN mes_orgs_ens
      - SELECT * FROM regles_notes WHERE organisation_id IN mes_orgs_ens
      - SELECT * FROM mentions_notes WHERE organisation_id IN mes_orgs_ens
      - SELECT * FROM evaluations WHERE service IN mes_services
      - SELECT * FROM evaluations WHERE classe_id IN mes_classes_pp
      - SELECT * FROM notes WHERE evaluation_id IN (SELECT id FROM evaluations WHERE service IN mes_services)
      - SELECT * FROM notes WHERE evaluation_id IN (SELECT id FROM evaluations WHERE classe_id IN mes_classes_pp)
      - SELECT * FROM notes_historique WHERE evaluation_id IN (SELECT id FROM evaluations WHERE service IN mes_services)
      - SELECT * FROM appreciations WHERE eleve_id IN (SELECT eleve_id FROM inscriptions WHERE classe_id IN mes_classes_pp)

  # Contacts des familles (noms, téléphones) : qui a le droit « voir_familles »
  # (par défaut : direction, secrétariat, comptabilité, caisse ; un lecteur, si on le lui accorde).
  familles:
    auto_subscribe: true
    priority: 3
    with:
      orgs_familles: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND lit_familles = true AND cycles IS NULL
    queries:
      - SELECT * FROM contacts WHERE organisation_id IN orgs_familles
      - SELECT * FROM eleves_contacts WHERE organisation_id IN orgs_familles

  # Caisse : qui a « voir_caisse » ou « consulter_tableau_bord ». Le serveur vérifie
  # aussi chaque écriture, droit par droit (un lecteur n'écrit rien).
  caisse:
    auto_subscribe: true
    priority: 3
    with:
      orgs_caisse: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND lit_caisse = true AND cycles IS NULL
    queries:
      - SELECT * FROM encaissements WHERE organisation_id IN orgs_caisse
      - SELECT * FROM lignes_encaissement WHERE organisation_id IN orgs_caisse
      - SELECT * FROM clotures_caisse WHERE organisation_id IN orgs_caisse
      - SELECT * FROM remboursements WHERE organisation_id IN orgs_caisse
      - SELECT * FROM echeances_eleves WHERE organisation_id IN orgs_caisse
      - SELECT * FROM depenses WHERE organisation_id IN orgs_caisse
      - SELECT * FROM justificatifs_depenses WHERE organisation_id IN orgs_caisse
      - SELECT * FROM images_ecole WHERE organisation_id IN orgs_caisse AND sorte = 'signature'
      - SELECT * FROM images_ecole WHERE organisation_id IN orgs_caisse AND sorte = 'cachet'

  # Notes et bulletins : qui saisit les notes, planifie les évaluations, consulte le
  # tableau de bord ou gère les inscriptions (impression des bulletins).
  notes:
    auto_subscribe: true
    priority: 3
    with:
      orgs_notes: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND lit_notes = true AND cycles IS NULL
    queries:
      - SELECT * FROM periodes_evaluation WHERE organisation_id IN orgs_notes
      - SELECT * FROM types_evaluation WHERE organisation_id IN orgs_notes
      - SELECT * FROM sessions_evaluation WHERE organisation_id IN orgs_notes
      - SELECT * FROM regles_notes WHERE organisation_id IN orgs_notes
      - SELECT * FROM mentions_notes WHERE organisation_id IN orgs_notes
      - SELECT * FROM notes_historique WHERE organisation_id IN orgs_notes
      - SELECT * FROM decisions_annee WHERE organisation_id IN orgs_notes
      - SELECT * FROM evaluations WHERE organisation_id IN orgs_notes
      - SELECT * FROM notes WHERE organisation_id IN orgs_notes
      - SELECT * FROM appreciations WHERE organisation_id IN orgs_notes

  # La paie (confidentielle) : seulement qui prépare, valide ou verse la paie.
  paie:
    auto_subscribe: true
    priority: 3
    with:
      orgs_paie: SELECT organisation_id FROM rattachements WHERE user_id = auth.user_id() AND actif = true AND lit_paie = true
    queries:
      - SELECT * FROM remunerations WHERE organisation_id IN orgs_paie
      - SELECT * FROM taux_horaires WHERE organisation_id IN orgs_paie
      - SELECT * FROM grille_taux WHERE organisation_id IN orgs_paie
      - SELECT * FROM avances WHERE organisation_id IN orgs_paie
      - SELECT * FROM paies WHERE organisation_id IN orgs_paie
      - SELECT * FROM lignes_paie WHERE organisation_id IN orgs_paie

  # Table de test « Bonjour » (première version de l'app).
  hellos:
    auto_subscribe: true
    query: SELECT * FROM hellos

  # Responsable de cycle (un principal : collège et lycée) : seulement les classes de ses
  # cycles (table perimetres, tenue par le serveur), leurs élèves, leurs parents s'il voit
  # les familles, leurs notes s'il lit les notes. Ni caisse, ni autres cycles.
  perimetre:
    auto_subscribe: true
    priority: 3
    with:
      classes_perim: SELECT classe_id FROM perimetres WHERE user_id = auth.user_id()
      classes_familles: SELECT classe_id FROM perimetres WHERE user_id = auth.user_id() AND familles = true
      classes_notes: SELECT classe_id FROM perimetres WHERE user_id = auth.user_id() AND notes = true
      orgs_notes_perim: SELECT organisation_id FROM perimetres WHERE user_id = auth.user_id() AND notes = true
    queries:
      - SELECT * FROM perimetres WHERE user_id = auth.user_id()
      - SELECT * FROM classes WHERE id IN classes_perim
      - SELECT * FROM inscriptions WHERE classe_id IN classes_perim
      - SELECT * FROM eleves WHERE id IN (SELECT eleve_id FROM inscriptions WHERE classe_id IN classes_perim)
      - SELECT * FROM photos_eleves WHERE eleve_id IN (SELECT eleve_id FROM inscriptions WHERE classe_id IN classes_perim)
      - SELECT * FROM historique_eleves WHERE eleve_id IN (SELECT eleve_id FROM inscriptions WHERE classe_id IN classes_perim)
      - SELECT * FROM impressions_documents WHERE eleve_id IN (SELECT eleve_id FROM inscriptions WHERE classe_id IN classes_perim)
      - SELECT * FROM eleves_contacts WHERE eleve_id IN (SELECT eleve_id FROM inscriptions WHERE classe_id IN classes_familles)
      - SELECT * FROM contacts WHERE id IN (SELECT contact_id FROM eleves_contacts WHERE eleve_id IN (SELECT eleve_id FROM inscriptions WHERE classe_id IN classes_familles))
      - SELECT * FROM periodes_evaluation WHERE organisation_id IN orgs_notes_perim
      - SELECT * FROM types_evaluation WHERE organisation_id IN orgs_notes_perim
      - SELECT * FROM sessions_evaluation WHERE organisation_id IN orgs_notes_perim
      - SELECT * FROM regles_notes WHERE organisation_id IN orgs_notes_perim
      - SELECT * FROM mentions_notes WHERE organisation_id IN orgs_notes_perim
      - SELECT * FROM evaluations WHERE classe_id IN classes_notes
      - SELECT * FROM notes WHERE evaluation_id IN (SELECT id FROM evaluations WHERE classe_id IN classes_notes)
      - SELECT * FROM notes_historique WHERE evaluation_id IN (SELECT id FROM evaluations WHERE classe_id IN classes_notes)
      - SELECT * FROM appreciations WHERE eleve_id IN (SELECT eleve_id FROM inscriptions WHERE classe_id IN classes_notes)
      - SELECT * FROM decisions_annee WHERE eleve_id IN (SELECT eleve_id FROM inscriptions WHERE classe_id IN classes_notes)
