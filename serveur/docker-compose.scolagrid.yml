# Ajouts de Scolagrid par-dessus le docker-compose.yml officiel de Supabase.
# Sert aux deux environnements : PREFIXE distingue les conteneurs
# (vide en production, « essai- » en essai) et SCOLAGRID_ENV les noms
# sous lesquels Caddy les joint sur le réseau partagé scolagrid-web.
# Aucun port n'est exposé : seul Caddy (serveur/caddy) l'est.

services:
  db:
    container_name: ${PREFIXE:-}supabase-db
  auth:
    container_name: ${PREFIXE:-}supabase-auth
    environment:
      # Connexion par téléphone. Tant qu'aucun fournisseur SMS n'est choisi, les
      # identifiants Twilio sont factices : seuls les numéros de test (SMS_TEST_OTP,
      # environnement d'essai) reçoivent un code, fixe, sans envoi de SMS.
      GOTRUE_SMS_PROVIDER: ${SMS_PROVIDER:-twilio}
      GOTRUE_SMS_TWILIO_ACCOUNT_SID: ${SMS_TWILIO_ACCOUNT_SID:-aucun}
      GOTRUE_SMS_TWILIO_AUTH_TOKEN: ${SMS_TWILIO_AUTH_TOKEN:-aucun}
      GOTRUE_SMS_TWILIO_MESSAGE_SERVICE_SID: ${SMS_TWILIO_MESSAGE_SERVICE_SID:-aucun}
      GOTRUE_SMS_TEST_OTP: ${SMS_TEST_OTP:-}
      GOTRUE_SMS_OTP_LENGTH: "6"
      GOTRUE_SMS_TEMPLATE: "Votre code Scolagrid : {{ .Code }}"
      # Production : envoi par NimbaSMS, via la fonction scolagrid.envoyer_sms.
      GOTRUE_HOOK_SEND_SMS_ENABLED: ${SMS_HOOK_ENABLED:-false}
      GOTRUE_HOOK_SEND_SMS_URI: ${SMS_HOOK_URI:-}
  rest:
    container_name: ${PREFIXE:-}supabase-rest
  meta:
    container_name: ${PREFIXE:-}supabase-meta
  studio:
    container_name: ${PREFIXE:-}supabase-studio

  api-gw:
    container_name: ${PREFIXE:-}supabase-envoy
    ports: !reset []
    networks:
      web:
        aliases:
          - api-gw-${SCOLAGRID_ENV}

  supavisor:
    ports: !reset []

  powersync-storage:
    container_name: ${PREFIXE:-}scolagrid-powersync-storage
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: powersync
      POSTGRES_PASSWORD: ${PS_STORAGE_PASSWORD}
      POSTGRES_DB: powersync_storage
    volumes:
      - powersync-storage:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "powersync", "-d", "powersync_storage"]
      interval: 5s
      timeout: 5s
      retries: 10

  powersync:
    container_name: ${PREFIXE:-}scolagrid-powersync
    image: journeyapps/powersync-service:1.27.2
    restart: unless-stopped
    command: ["start", "-c", "/config/service.yaml"]
    depends_on:
      db:
        condition: service_healthy
      powersync-storage:
        condition: service_healthy
    environment:
      PS_DATA_SOURCE_URI: postgresql://powersync_role:${PS_POWERSYNC_PASSWORD}@db:5432/postgres
      PS_STORAGE_URI: postgresql://powersync:${PS_STORAGE_PASSWORD}@powersync-storage:5432/powersync_storage
      PS_JWT_K: ${PS_JWT_K}
    volumes:
      - ./powersync:/config:ro
    networks:
      default:
      web:
        aliases:
          - powersync-${SCOLAGRID_ENV}

volumes:
  powersync-storage:

networks:
  web:
    external: true
    name: scolagrid-web
