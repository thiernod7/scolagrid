name: scolagrid
description: Scolagrid, gestion scolaire hors ligne d'abord.
publish_to: none
version: 0.7.3+10

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  crypto: ^3.0.6
  excel: ^4.0.6
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  image_picker: ^1.2.3
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.11.1
  powersync: ^2.5.0
  printing: ^5.13.4
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Polices intégrées (limitées aux caractères latins) : l'app reste belle sans internet.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/polices/Inter-Regular.ttf
        - asset: assets/polices/Inter-Medium.ttf
          weight: 500
        - asset: assets/polices/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/polices/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/polices/JetBrainsMono-Medium.ttf
          weight: 500
