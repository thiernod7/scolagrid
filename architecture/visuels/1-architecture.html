<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Architecture offline-first</title>
<link rel="stylesheet" href="vendor/tabler-icons.min.css">
<script>if(/[?&]embed/.test(location.search))document.documentElement.classList.add("embed")</script>
<style>.embed .back{display:none!important}.embed main{padding-top:6px}</style>
<style>
:root{--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-muted:#888780;--surface-0:#f5f4ef;--surface-1:#faf9f5;--surface-2:#fff;--border:rgba(0,0,0,.1);--border-strong:rgba(0,0,0,.18);--border-danger:#F09595;--bg-success:#EAF3DE;--text-success:#3B6D11;--bg-danger:#FCEBEB;--text-danger:#A32D2D;--radius:8px;--b:var(--border-strong)}
@media (prefers-color-scheme:dark){:root{--text-primary:#ecebe6;--text-secondary:#b4b2a9;--text-muted:#888780;--surface-0:#1a1a19;--surface-1:#232322;--surface-2:#2c2c2a;--border:rgba(255,255,255,.1);--border-strong:rgba(255,255,255,.2);--border-danger:#A32D2D;--bg-success:#27500A;--text-success:#C0DD97;--bg-danger:#501313;--text-danger:#F7C1C1}}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:420px;margin:0 auto;padding:16px}
@media (min-width:560px){main{zoom:1.25}}@media (min-width:720px){main{zoom:1.5}}@media (min-width:1000px){main{zoom:1.75}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button{font:inherit;font-size:14px;padding:8px 14px;border-radius:var(--radius);border:.5px solid var(--border-strong);background:transparent;color:var(--text-primary);cursor:pointer}
button:hover{background:var(--surface-1)}
svg text{font-family:inherit}
.t{font-size:14px;fill:var(--text-primary)}
.ts{font-size:12px;fill:var(--text-secondary)}
.th{font-size:14px;font-weight:500;fill:var(--text-primary)}
.box{fill:var(--surface-1);stroke:var(--border-strong)}
.node{cursor:pointer}.node:hover{opacity:.85}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
@media (prefers-color-scheme:dark){
.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#CECBF6}.c-purple>.ts{fill:#AFA9EC}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#9FE1CB}.c-teal>.ts{fill:#5DCAA5}}
.pk{opacity:0}
@media (prefers-reduced-motion:no-preference){
.pk{animation:mv 1.6s linear infinite}
.d2{animation-delay:.8s}
#net.off .pk{animation:none;opacity:0}
}
@keyframes mv{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(var(--d));opacity:0}}
#net.off .wire{stroke:#E24B4A;stroke-dasharray:4 5}
.btn{display:block;margin:12px auto 4px;padding:10px 18px;background:var(--surface-2)}
</style>
<script>window.sendPrompt=t=>console.log('[sendPrompt]',t);</script>
</head>
<body>
<main>
<a class="back" href="index.html" style="display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--text-secondary);text-decoration:none;margin-bottom:8px"><i class="ti ti-arrow-left" aria-hidden="true"></i> Tous les visuels</a>
<h2 class="sr-only">Architecture SaaS offline-first animée : l'interface lit et écrit dans une base locale, une file de synchronisation envoie les changements au cloud dès que le réseau revient, puis le cloud redistribue aux autres appareils.</h2>
<svg width="100%" viewBox="0 0 380 600" role="img"><title>Architecture offline-first</title><desc>Interface, base locale et file de sync sur l'appareil ; moteur de sync et base centrale dans le cloud ; redistribution aux autres appareils.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="20" y="10" width="340" height="252" rx="16" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="36" y="30">Appareil</text>
<g class="node c-purple" onclick="sendPrompt('Explique la couche interface dans une archi offline-first')"><rect x="70" y="40" width="240" height="50" rx="8" stroke-width="0.5"/><text class="th" x="190" y="58" text-anchor="middle" dominant-baseline="central">Interface</text><text class="ts" x="190" y="76" text-anchor="middle" dominant-baseline="central">Réponse instantanée</text></g>
<line x1="190" y1="92" x2="190" y2="116" stroke="#7F77DD" stroke-width="0.8"/>
<circle class="pk" cx="190" cy="94" r="3.5" fill="#7F77DD" style="--d:20px"/>
<g class="node c-purple" onclick="sendPrompt('Quelle base locale choisir pour une app offline-first ?')"><rect x="70" y="118" width="240" height="50" rx="8" stroke-width="0.5"/><text class="th" x="190" y="136" text-anchor="middle" dominant-baseline="central">Base locale</text><text class="ts" x="190" y="154" text-anchor="middle" dominant-baseline="central">SQLite · IndexedDB</text></g>
<line x1="190" y1="170" x2="190" y2="194" stroke="#7F77DD" stroke-width="0.8"/>
<circle class="pk d2" cx="190" cy="172" r="3.5" fill="#7F77DD" style="--d:20px"/>
<g class="node c-purple" onclick="sendPrompt('Comment fonctionne la file de synchronisation (outbox) ?')"><rect x="70" y="196" width="240" height="50" rx="8" stroke-width="0.5"/><text class="th" x="190" y="214" text-anchor="middle" dominant-baseline="central">File de sync</text><text class="ts" id="qt" x="190" y="232" text-anchor="middle" dominant-baseline="central">0 en attente</text></g>
<g id="net">
<line class="wire" x1="170" y1="264" x2="170" y2="318" stroke="#1D9E75" stroke-width="1"/>
<line class="wire" x1="210" y1="264" x2="210" y2="318" stroke="#1D9E75" stroke-width="1"/>
<circle class="pk" cx="170" cy="266" r="4" fill="#1D9E75" style="--d:50px"/>
<circle class="pk d2" cx="210" cy="316" r="4" fill="#1D9E75" style="--d:-50px"/>
<text class="ts" id="st" x="232" y="295" dominant-baseline="central">En ligne</text>
<rect x="20" y="320" width="340" height="186" rx="16" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="36" y="340">Cloud</text>
<g class="node c-teal" onclick="sendPrompt('Comment le moteur de sync gère-t-il les conflits ?')"><rect x="70" y="352" width="240" height="50" rx="8" stroke-width="0.5"/><text class="th" x="190" y="370" text-anchor="middle" dominant-baseline="central">Moteur de sync</text><text class="ts" x="190" y="388" text-anchor="middle" dominant-baseline="central">Fusion des conflits</text></g>
<line x1="190" y1="404" x2="190" y2="428" stroke="#1D9E75" stroke-width="0.8"/>
<circle class="pk" cx="190" cy="406" r="3.5" fill="#1D9E75" style="--d:20px"/>
<g class="node c-teal" onclick="sendPrompt('Pourquoi PostgreSQL comme base centrale ?')"><rect x="70" y="430" width="240" height="50" rx="8" stroke-width="0.5"/><text class="th" x="190" y="448" text-anchor="middle" dominant-baseline="central">Base centrale</text><text class="ts" x="190" y="466" text-anchor="middle" dominant-baseline="central">PostgreSQL</text></g>
<line class="wire" x1="190" y1="508" x2="190" y2="538" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
<circle class="pk d2" cx="190" cy="510" r="3.5" fill="#1D9E75" style="--d:24px"/>
</g>
<g class="node" onclick="sendPrompt('Comment les autres appareils reçoivent les mises à jour en temps réel ?')"><rect class="box" x="70" y="542" width="240" height="44" rx="8" stroke-width="0.5"/><text class="th" x="190" y="564" text-anchor="middle" dominant-baseline="central">Autres appareils</text></g>
</svg>
<button class="btn" id="tg" onclick="tog()"><i class="ti ti-wifi-off" aria-hidden="true"></i> Couper le réseau</button>
</main>
<script>
let off=false,q=0;
const n=document.getElementById('net'),qt=document.getElementById('qt'),st=document.getElementById('st'),b=document.getElementById('tg');
function tog(){off=!off;n.classList.toggle('off',off);st.textContent=off?'Hors ligne':'En ligne';b.innerHTML=off?'<i class="ti ti-wifi" aria-hidden="true"></i> Rétablir le réseau':'<i class="ti ti-wifi-off" aria-hidden="true"></i> Couper le réseau';}
setInterval(()=>{if(off)q++;else if(q>0)q--;qt.textContent=q+' en attente';},900);
</script>
</body>
</html>
