name: VPS - Diagnostic de la paie (essai, lecture seule)

# Paie de l'école de démonstration de l'essai, SANS RIEN MODIFIER.
# Le journal est public : il n'affiche que des nombres. Voir serveur/outils/diagnostic-paie.sql.

on:
  push:
    paths:
      - ".github/workflows/vps-diagnostic-paie.yml"
      - "serveur/outils/diagnostic-paie.sql"
  workflow_dispatch:

concurrency:
  group: vps
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer la connexion SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Essai
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          ssh -o ConnectTimeout=20 "$VPS" "sudo docker exec -i essai-supabase-db psql -X -q -U supabase_admin -d postgres" \
            < serveur/outils/diagnostic-paie.sql
      - name: PowerSync de l'essai (nombre de lignes d'erreur seulement)
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          ssh -o ConnectTimeout=20 "$VPS" 'for c in $(sudo -n docker ps --format "{{.Names}}" | grep -i essai | grep -i powersync); do echo "$c : $(sudo -n docker logs --since 24h $c 2>&1 | grep -ciE "error") erreur(s) en 24 h, dont $(sudo -n docker logs --since 24h $c 2>&1 | grep -iE "error" | grep -ciE "paie|remuneration|avance|grille_taux|taux_horaire") sur la paie"; echo "  codes d'erreur (nombre) :"; sudo -n docker logs --since 24h $c 2>&1 | grep -iE "error" | grep -oE "PSYNC_[A-Z0-9]+" | sort | uniq -c | sort -rn | head -10; done'
