name: VPS - Inspecter

# Lecture seule : décrit l'état du serveur sans rien modifier.
# Le repo est public, donc ce journal est visible de tous :
# on n'affiche ni adresse, ni fichier de configuration, ni contenu.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/vps-inspecter.yml"

jobs:
  inspecter:
    runs-on: ubuntu-latest
    steps:
      - name: Préparer la connexion SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          # Empreinte de la clé (publique, sans risque) pour vérifier que c'est la bonne.
          ssh-keygen -lf ~/.ssh/id_ed25519

      - name: Inspecter
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          ssh -o ConnectTimeout=20 "$VPS" 'bash -s' <<'EOF'
          section() { echo; echo "===== $1 ====="; }
          section "Système";        . /etc/os-release; echo "$PRETTY_NAME"; uname -r
          section "Processeurs";    nproc
          section "Mémoire";        free -h
          section "Disque";         df -h /
          section "Sudo sans mot de passe"; sudo -n true 2>/dev/null && echo oui || echo non
          section "Dossier personnel"; ls -A ~
          section "Dossiers d'applications"; ls -A /opt /srv /var/www 2>&1
          section "Docker";         command -v docker >/dev/null && sudo -n docker ps -a --format '{{.Names}}  {{.Image}}  {{.Status}}' 2>&1 || echo "Docker absent"
          section "Services actifs"; systemctl list-units --type=service --state=running --no-pager --no-legend | awk '{print $1}'
          section "Ports ouverts";  sudo -n ss -tlnp 2>/dev/null | awk 'NR>1{print $4, $6}' || ss -tln | awk 'NR>1{print $4}'
          section "Paquets installés à la main"; apt-mark showmanual 2>/dev/null | wc -l
          section "Sauvegardes"; cat /var/lib/scolagrid/derniere-sauvegarde 2>/dev/null || echo "aucune"
          masquer() { sed -E 's/[0-9]{6,}/######/g; s/"(access_token|token|secret|password)"[^,}]*/"\1":"***"/g'; }
          section "SMS : dernières réponses de NimbaSMS (numéros masqués)"
          sudo -n docker exec supabase-db psql -X -A -t -U supabase_admin -d postgres -c \
            "select created, status_code, coalesce(error_msg,''), left(coalesce(content,''), 300) from net._http_response order by created desc limit 5" 2>&1 | masquer
          section "SMS : réglages présents (valeurs cachées)"
          sudo -n docker exec supabase-db psql -X -A -t -U supabase_admin -d postgres -c \
            "select cle, length(valeur) from scolagrid.reglages order by cle" 2>&1
          section "SMS : variables du service de connexion"
          sudo -n docker exec supabase-auth env 2>/dev/null | grep -E '^GOTRUE_(HOOK_SEND_SMS_ENABLED|HOOK_SEND_SMS_URI|EXTERNAL_PHONE_ENABLED|SMS_AUTOCONFIRM)=' || echo "indisponible"
          section "SMS : journal du service de connexion"
          sudo -n docker logs --since 2h supabase-auth 2>&1 | grep -iE 'sms|hook|otp' | tail -15 | masquer
          section "PowerSync (erreurs et réplication)"; sudo -n docker logs scolagrid-powersync 2>&1 | grep -iE 'error|replicat|snapshot|slot' | tail -15 || echo "pas de PowerSync"
          EOF
