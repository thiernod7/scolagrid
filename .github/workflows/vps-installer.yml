name: VPS - Installer

# Installe ou met à jour un environnement Scolagrid (Supabase, PowerSync, Caddy).
# Branche principale -> production ; toute autre branche -> essai.
# Rejouable sans risque : les données et les secrets existants sont conservés.

on:
  workflow_dispatch:
    inputs:
      environnement:
        description: "Environnement à installer"
        type: choice
        options:
          - essai
          - prod
        default: essai
  push:
    paths:
      - "serveur/**"
      - ".github/workflows/vps-installer.yml"

concurrency:
  group: vps
  cancel-in-progress: false

jobs:
  tester-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Vérifier les règles de synchronisation
        # Même version de la bibliothèque que l'image powersync-service utilisée.
        working-directory: serveur/outils
        run: |
          npm install --no-save --silent @powersync/service-sync-rules@0.44.0
          node valider-synchro.mjs ../powersync/sync-config.yaml
      - name: Démarrer une base Supabase jetable
        run: |
          image=$(curl -fsSL https://raw.githubusercontent.com/supabase/supabase/master/docker/docker-compose.yml \
            | grep -m1 -o 'supabase/postgres:[^ ]*')
          echo "Image : $image"
          docker run -d --name db -e POSTGRES_PASSWORD=test -e PGPASSWORD=test "$image" \
            postgres -c config_file=/etc/postgresql/postgresql.conf
          for i in $(seq 1 60); do docker exec db pg_isready -U postgres -h localhost -q && break; sleep 2; done
          sleep 5
      - name: Appliquer les migrations
        run: bash serveur/appliquer-migrations.sh db serveur/migrations
      - name: Les rejouer ne doit rien changer
        run: bash serveur/appliquer-migrations.sh db serveur/migrations | tee /tmp/sortie && ! grep -q "appliquée" /tmp/sortie
      - name: Tests de sécurité
        run: |
          for t in serveur/tests/*.sql; do
            echo "== $t"
            docker exec -i db psql -X -q -v ON_ERROR_STOP=1 -U supabase_admin -d postgres < "$t"
          done

  installer:
    needs: tester-migrations
    runs-on: ubuntu-latest
    env:
      ENVIRONNEMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environnement || (github.ref_name == github.event.repository.default_branch && 'prod' || 'essai') }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la connexion SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Transmettre l'accès aux sauvegardes
        if: env.ENVIRONNEMENT == 'prod'
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          DEPOT: ${{ secrets.SAUVEGARDE_DEPOT }}
          CLE_ID: ${{ secrets.SAUVEGARDE_CLE_ID }}
          CLE_SECRETE: ${{ secrets.SAUVEGARDE_CLE_SECRETE }}
          MOT_DE_PASSE: ${{ secrets.SAUVEGARDE_MOT_DE_PASSE }}
        run: |
          if [ -z "$DEPOT" ] || [ -z "$MOT_DE_PASSE" ]; then echo "Sauvegardes non configurées"; exit 0; fi
          {
            printf 'RESTIC_REPOSITORY=%q\n' "$DEPOT"
            printf 'RESTIC_PASSWORD=%q\n' "$MOT_DE_PASSE"
            printf 'AWS_ACCESS_KEY_ID=%q\n' "$CLE_ID"
            printf 'AWS_SECRET_ACCESS_KEY=%q\n' "$CLE_SECRETE"
          } | ssh "$VPS" 'sudo mkdir -p /opt/scolagrid && sudo install -m 600 /dev/stdin /opt/scolagrid/sauvegarde.env'
          echo "Accès transmis"

      - name: Installer (${{ env.ENVIRONNEMENT }})
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          host="$(echo "$VPS_HOST" | tr . -).sslip.io"
          ssh "$VPS" 'rm -rf /tmp/scolagrid-serveur'
          scp -q -r serveur "$VPS":/tmp/scolagrid-serveur
          ssh "$VPS" "bash /tmp/scolagrid-serveur/installer.sh $host $ENVIRONNEMENT; s=\$?; rm -rf /tmp/scolagrid-serveur; exit \$s"
