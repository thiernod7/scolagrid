name: Compiler l'application

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

# Les adresses du cloud viennent des variables du repo
# (Settings > Secrets and variables > Actions > Variables).
# Si elles sont absentes, l'app fonctionne en local seulement.
env:
  DART_DEFINES: >-
    --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
    --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
    --dart-define=POWERSYNC_URL=${{ vars.POWERSYNC_URL }}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration du serveur
        run: |
          for v in SUPABASE_URL=${{ vars.SUPABASE_URL }} POWERSYNC_URL=${{ vars.POWERSYNC_URL }} SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}; do
            [ -n "${v#*=}" ] && echo "${v%%=*} : renseignée" || echo "${v%%=*} : ABSENTE (l'app fonctionnera en local seulement)"
          done
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows,android --org com.scolagrid --project-name scolagrid . && rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build windows --release $DART_DEFINES
      - uses: actions/upload-artifact@v4
        with:
          name: scolagrid-windows
          path: app/build/windows/x64/runner/Release/

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows,android --org com.scolagrid --project-name scolagrid . && rm -f test/widget_test.dart
      # Android exige une autorisation explicite pour accéder à internet.
      - run: sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release $DART_DEFINES
      - uses: actions/upload-artifact@v4
        with:
          name: scolagrid-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
