name: Compiler l'application

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

# Branche principale : app reliée à la production (variables du repo
# SUPABASE_URL, SUPABASE_ANON_KEY, POWERSYNC_URL).
# Autres branches : app reliée à l'environnement d'essai ; sa clé publique
# est lue sur le serveur, rien à configurer.

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      environnement: ${{ steps.c.outputs.environnement }}
    steps:
      - id: c
        env:
          PROD: ${{ github.ref_name == github.event.repository.default_branch }}
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ "$PROD" = true ]; then
            # Les jobs de compilation lisent eux-mêmes les variables : GitHub ne
            # transmet pas une sortie qui ressemble à un secret.
            echo "environnement=prod" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          host="$(echo "$VPS_HOST" | tr . -).sslip.io"
          cle=$(ssh "$VPS" "grep '^ANON_KEY=' /opt/scolagrid/essai/supabase/.env | cut -d= -f2-")
          [ -n "$cle" ] || { echo "Clé de l'essai introuvable sur le serveur"; exit 1; }
          echo "environnement=essai" >> "$GITHUB_OUTPUT"
          # Passé par un fichier : GitHub bloque les sorties qui ressemblent à un secret.
          echo "--dart-define=SCOLAGRID_ENV=essai --dart-define=SUPABASE_URL=https://api-essai.$host --dart-define=SUPABASE_ANON_KEY=$cle --dart-define=POWERSYNC_URL=https://sync-essai.$host" > defines-essai.txt
          echo "App reliée à l'essai : https://api-essai.$host"
      - if: steps.c.outputs.environnement == 'essai'
        uses: actions/upload-artifact@v4
        with:
          name: defines-essai
          path: defines-essai.txt
          retention-days: 1

  windows:
    needs: config
    runs-on: windows-latest
    env:
      DART_DEFINES: ${{ needs.config.outputs.environnement == 'prod' && format('--dart-define=SCOLAGRID_ENV=prod --dart-define=SUPABASE_URL={0} --dart-define=SUPABASE_ANON_KEY={1} --dart-define=POWERSYNC_URL={2}', vars.SUPABASE_URL, vars.SUPABASE_ANON_KEY, vars.POWERSYNC_URL) || '' }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - if: needs.config.outputs.environnement == 'essai'
        uses: actions/download-artifact@v4
        with:
          name: defines-essai
          path: app
      - if: needs.config.outputs.environnement == 'essai'
        run: echo "DART_DEFINES_ESSAI=$(cat defines-essai.txt)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows,android --org com.scolagrid --project-name scolagrid . && rm -f test/widget_test.dart
      # Icône et nom ScolaGrid (au lieu de ceux de Flutter), générés par marque/outils/icones_app.py.
      - name: Icône et nom ScolaGrid (Windows)
        shell: bash
        run: |
          cp plateformes/windows/app_icon.ico windows/runner/resources/app_icon.ico
          sed -i 's/L"scolagrid"/L"ScolaGrid"/' windows/runner/main.cpp
          sed -i 's/"scolagrid"/"ScolaGrid"/g' windows/runner/Runner.rc
      - run: flutter pub get
      - name: Bibliothèques SQLite (téléchargées avec nouvelles tentatives)
        run: bash plateformes/sqlite3_binaires.sh sqlite3.x64.windows.dll && flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Vérifier que l'app connaît son serveur
        run: '[ -n "$DART_DEFINES$DART_DEFINES_ESSAI" ] || { echo "Aucune adresse de serveur : compilation arrêtée"; exit 1; }'
      - run: flutter build windows --release $DART_DEFINES $DART_DEFINES_ESSAI
      - uses: actions/upload-artifact@v4
        with:
          name: scolagrid-windows-${{ needs.config.outputs.environnement }}
          path: app/build/windows/x64/runner/Release/

  android:
    needs: config
    runs-on: ubuntu-latest
    env:
      DART_DEFINES: ${{ needs.config.outputs.environnement == 'prod' && format('--dart-define=SCOLAGRID_ENV=prod --dart-define=SUPABASE_URL={0} --dart-define=SUPABASE_ANON_KEY={1} --dart-define=POWERSYNC_URL={2}', vars.SUPABASE_URL, vars.SUPABASE_ANON_KEY, vars.POWERSYNC_URL) || '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - if: needs.config.outputs.environnement == 'essai'
        uses: actions/download-artifact@v4
        with:
          name: defines-essai
          path: app
      - if: needs.config.outputs.environnement == 'essai'
        run: echo "DART_DEFINES_ESSAI=$(cat defines-essai.txt)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows,android --org com.scolagrid --project-name scolagrid . && rm -f test/widget_test.dart
      # Android exige une autorisation explicite pour accéder à internet.
      - run: sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
      # Icône ScolaGrid (adaptative : fond blanc, dessin noir) et nom affiché sous l'icône.
      - name: Icône et nom ScolaGrid (Android)
        run: |
          cp -r plateformes/android/. android/app/src/main/res/
          sed -i 's/android:label="scolagrid"/android:label="ScolaGrid"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android:label="ScolaGrid"' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Bibliothèques SQLite (téléchargées avec nouvelles tentatives)
        run: bash plateformes/sqlite3_binaires.sh libsqlite3.arm.android.so libsqlite3.arm64.android.so libsqlite3.x64.android.so libsqlite3.ia32.android.so libsqlite3.x64.linux.so && flutter pub get
      - name: Vérifier que l'app connaît son serveur
        run: '[ -n "$DART_DEFINES$DART_DEFINES_ESSAI" ] || { echo "Aucune adresse de serveur : compilation arrêtée"; exit 1; }'
      # Signature avec la clé fixe de Scolagrid, faite par Gradle pendant la
      # compilation (comme le prévoit Flutter) : sans elle, chaque version a une
      # clé différente et Android refuse la mise à jour.
      - name: Préparer la signature
        env:
          SECRET: ${{ secrets.ANDROID_CLE_SECRET }}
        run: |
          if [ ! -f signature/scolagrid.jks.enc ] || [ -z "$SECRET" ]; then
            echo "::warning::Pas de clé de signature fixe : APK signé avec une clé jetable."
            exit 0
          fi
          cle="$RUNNER_TEMP/scolagrid.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in signature/scolagrid.jks.enc -out "$cle" -pass env:SECRET
          echo "SCOLAGRID_KEYSTORE=$cle" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import pathlib, sys
          p = pathlib.Path("android/app/build.gradle.kts")
          s = p.read_text()
          ancien = 'signingConfig = signingConfigs.getByName("debug")'
          if ancien not in s or "buildTypes {" not in s:
              sys.exit("build.gradle.kts inattendu : signature impossible")
          bloc = """signingConfigs {
                  create("scolagrid") {
                      storeFile = file(System.getenv("SCOLAGRID_KEYSTORE"))
                      storePassword = System.getenv("ANDROID_CLE_SECRET")
                      keyAlias = "scolagrid"
                      keyPassword = System.getenv("ANDROID_CLE_SECRET")
                  }
              }

              buildTypes {"""
          s = s.replace("buildTypes {", bloc, 1).replace(ancien, 'signingConfig = signingConfigs.getByName("scolagrid")')
          p.write_text(s)
          print("Signature Scolagrid branchée dans Gradle")
          PY
      - run: flutter build apk --release $DART_DEFINES $DART_DEFINES_ESSAI
        env:
          ANDROID_CLE_SECRET: ${{ secrets.ANDROID_CLE_SECRET }}
      # Avant de publier : signature valide, et bibliothèques alignées sur 16 Ko
      # (exigé par certains téléphones Android 15), sinon on s'arrête ici.
      - name: Vérifier l'APK
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          rm -f "$RUNNER_TEMP/scolagrid.jks"
          outils=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$outils/apksigner" verify --verbose --print-certs "$apk" | grep -E "Verified using|certificate SHA-256" | head -6
          "$outils/zipalign" -c -P 16 4 "$apk" && echo "Alignement 16 Ko : correct"
      - uses: actions/upload-artifact@v4
        with:
          name: scolagrid-android-${{ needs.config.outputs.environnement }}
          path: app/build/app/outputs/flutter-apk/app-release.apk

  web:
    needs: config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      DART_DEFINES: ${{ needs.config.outputs.environnement == 'prod' && format('--dart-define=SCOLAGRID_ENV=prod --dart-define=SUPABASE_URL={0} --dart-define=SUPABASE_ANON_KEY={1} --dart-define=POWERSYNC_URL={2}', vars.SUPABASE_URL, vars.SUPABASE_ANON_KEY, vars.POWERSYNC_URL) || '' }}
    steps:
      - uses: actions/checkout@v4
      - if: needs.config.outputs.environnement == 'essai'
        uses: actions/download-artifact@v4
        with:
          name: defines-essai
          path: app
      - if: needs.config.outputs.environnement == 'essai'
        run: echo "DART_DEFINES_ESSAI=$(cat defines-essai.txt)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=web --org com.scolagrid --project-name scolagrid . && rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Bibliothèques SQLite (téléchargées avec nouvelles tentatives)
        run: bash plateformes/sqlite3_binaires.sh libsqlite3.x64.linux.so && flutter pub get
      - name: Fichiers web de PowerSync (SQLite dans le navigateur)
        run: dart run powersync:setup_web
      - name: Titre et langue de la page
        run: sed -i 's|<html>|<html lang="fr">|; s|<title>[^<]*</title>|<title>ScolaGrid</title>|; s|content="scolagrid"|content="ScolaGrid"|g' web/index.html
      - name: Icônes et nom ScolaGrid (web)
        run: |
          cp -r plateformes/web/. web/
          sed -i 's/"scolagrid"/"ScolaGrid"/g; s/#0175C2/#0A0A0A/g' web/manifest.json
      - name: Vérifier que l'app connaît son serveur
        run: '[ -n "$DART_DEFINES$DART_DEFINES_ESSAI" ] || { echo "Aucune adresse de serveur : compilation arrêtée"; exit 1; }'
      - run: flutter build web --release $DART_DEFINES $DART_DEFINES_ESSAI
      - uses: actions/upload-artifact@v4
        with:
          name: scolagrid-web-${{ needs.config.outputs.environnement }}
          path: app/build/web/

  # Met en ligne le site web et les installables : app.<hôte> (production)
  # ou app-essai.<hôte> (essai), téléchargements dans /telechargements/.
  publier:
    needs: [config, web, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scolagrid-web-${{ needs.config.outputs.environnement }}
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: scolagrid-windows-${{ needs.config.outputs.environnement }}
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: scolagrid-android-${{ needs.config.outputs.environnement }}
          path: android
      - name: Préparer les téléchargements
        run: |
          mkdir -p site/telechargements
          (cd windows && zip -qr ../site/telechargements/scolagrid-windows.zip .)
          cp android/app-release.apk site/telechargements/scolagrid-android.apk
          ls -la site/telechargements
      - name: Préparer la connexion SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Publier sur le serveur (${{ needs.config.outputs.environnement }})
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          ENVIRONNEMENT: ${{ needs.config.outputs.environnement }}
        run: |
          host="$(echo "$VPS_HOST" | tr . -).sslip.io"
          suffixe=$([ "$ENVIRONNEMENT" = essai ] && echo -essai || true)
          ssh "$VPS" 'rm -rf /tmp/scolagrid-web && mkdir -p /tmp/scolagrid-web'
          scp -q -r site/. "$VPS":/tmp/scolagrid-web/
          # Remplacement d'un bloc : le site n'est jamais à moitié copié.
          ssh "$VPS" "cd /opt/scolagrid/web && sudo rm -rf $ENVIRONNEMENT.ancien \
            && { sudo mv $ENVIRONNEMENT $ENVIRONNEMENT.ancien || true; } \
            && sudo mv /tmp/scolagrid-web $ENVIRONNEMENT && sudo chmod -R a+rX $ENVIRONNEMENT \
            && sudo rm -rf $ENVIRONNEMENT.ancien"
          for chemin in / /telechargements/scolagrid-windows.zip /telechargements/scolagrid-android.apk; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://app$suffixe.$host$chemin")
            echo "$code https://app$suffixe.$host$chemin"
            [ "$code" = 200 ] || exit 1
          done
          echo "### Scolagrid en ligne : https://app$suffixe.$host" >> "$GITHUB_STEP_SUMMARY"

